name: osinara-production

x-bounded-json-logs: &bounded-json-logs
  driver: json-file
  options:
    max-file: "5"
    max-size: "20m"

services:
  postgres:
    cgroup_parent: osinara.slice
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    # Development shares this host. At its peaks the kernel reclaimed the bot as readily as the
    # tests, and the database missed the five-second connect window or restarted itself (#253).
    # A reservation is cgroup memory.low, not a quota: what a service holds below it is reclaimed
    # only after unprotected neighbours. It counts only up to what the parent protects, so every
    # service runs in its own osinara.slice, which the host gives the sum of the three reservations
    # (2000 MB, docs/production-deployment.md). Protection a service does not use stays inside
    # the slice instead of going to development in system.slice.
    # PostgreSQL's own memory is ~160 MB (128 MB shared buffers); the rest keeps hot pages cached.
    mem_reservation: 300m
    environment:
      POSTGRES_DB: osinara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: osinara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osinara -d osinara"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
    restart: unless-stopped
    logging: *bounded-json-logs
    volumes:
      - postgres-data:/var/lib/postgresql/data

  memory-embedding:
    cgroup_parent: osinara.slice
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    # Sized by measurement on a six-core host, not by guess. Memory is set by the math threads
    # alone: three cores cost eleven megabytes more than two, while a third math thread costs four
    # hundred and does not fit a gigabyte at all — the container is killed while loading the model.
    # Two threads peak at 870 MB under a saturating load. The CPU budget is separate and cheap:
    # tokenization and request handling use the third core without touching that peak, and it buys
    # 45% more indexing throughput and a third off the wait when a search queues behind a batch.
    cpus: 3.0
    mem_limit: 1024m
    # The model's steady footprint. Docker refuses a reservation that is not below the limit.
    mem_reservation: 900m
    command:
      - --model-id
      - intfloat/multilingual-e5-small
      - --revision
      - 614241f622f53c4eeff9890bdc4f31cfecc418b3
      - --tokenization-workers
      - "2"
      - --max-client-batch-size
      - "8"
      # One queue slot per input, so a client batch of eight fills a limit of eight and the search
      # arriving beside it is refused rather than queued — the turn silently loses its semantic
      # branch. Measured against a saturating indexer: at eight, 15 searches out of 60 were refused;
      # at sixteen, none, at no cost in memory.
      - --max-concurrent-requests
      - "16"
      - --max-batch-requests
      - "8"
      - --max-batch-tokens
      - "4096"
      - --auto-truncate=false
    environment:
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 120
    networks:
      - app-network
    restart: unless-stopped
    logging: *bounded-json-logs
    volumes:
      - memory-embedding-model-e5:/data

  cli-proxy-api:
    cgroup_parent: osinara.slice
    image: ${OSINARA_CLI_PROXY_IMAGE:?OSINARA_CLI_PROXY_IMAGE must be an exact digest reference}
    environment:
      CLI_PROXY_API_KEY: ${CLI_PROXY_API_KEY:?CLI_PROXY_API_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --header \"Authorization: Bearer $${CLI_PROXY_API_KEY}\" http://127.0.0.1:8317/v1/models >/dev/null"]
      # Этот компонент пишет строку журнала на каждый запрос, и отключить её нечем: журнал ведёт
      # сторонний бинарник. Опрос раз в пять секунд давал 100 194 строки за неделю из 355 135 по
      # всему проекту. Пока контейнер поднимается, проверка идёт часто; дальше раз в полминуты —
      # этого хватает, чтобы заметить смерть процесса, и в шесть раз меньше шума.
      interval: 30s
      start_period: 100s
      start_interval: 2s
      timeout: 5s
      retries: 3
    networks:
      - app-network
    read_only: true
    restart: unless-stopped
    logging: *bounded-json-logs
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/cli-proxy-api:size=16m,mode=0700,uid=10001,gid=10001
    volumes:
      - cli-proxy-auth:/var/lib/cli-proxy-api/auth

  agent:
    cgroup_parent: osinara.slice
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    # Steady footprint measured on production 2026-09-23: ~740 MB, 160 MB of it pushed to swap.
    mem_reservation: 800m
    command: ["start-after-migration"]
    depends_on:
      cli-proxy-api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      memory-embedding:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET-}
      GROQ_API_KEY: ${GROQ_API_KEY-}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY-}
      INVITATION_SIGNING_SECRET: ${INVITATION_SIGNING_SECRET:?INVITATION_SIGNING_SECRET is required}
      MEMORY_EMBEDDING_BASE_URL: http://memory-embedding:80
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:?TELEGRAM_WEBHOOK_SECRET_TOKEN is required}
      WORKFLOW_POSTGRES_JOB_PREFIX: osinara
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: "12"
      WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:?WORKFLOW_POSTGRES_URL is required}
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "10"
      WORKFLOW_QUEUE_NAMESPACE: eve6f73696e6172612d66616d696c792d6167656e74
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/eve/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 72
    networks:
      - app-network
      - sandbox-control
    restart: unless-stopped
    logging: *bounded-json-logs
    volumes:
      - /opt/osinara/agent-model-providers.json:/app/config/agent-model-providers.json:ro
      - google-workspace-credentials:/app/google-workspace-credentials
      - sandbox-data:/app/.eve/sandbox-cache
      - workspace-data:/app/workspaces

  migrate:
    cgroup_parent: osinara.slice
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npm", "run", "migrate:runtime"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:?WORKFLOW_POSTGRES_URL is required}
    networks:
      - app-network
    restart: "no"
    logging: *bounded-json-logs

  memory-embedding-worker:
    cgroup_parent: osinara.slice
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    depends_on:
      memory-embedding:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["node", ".runtime/scripts/memory-embedding-worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MEMORY_EMBEDDING_BASE_URL: http://memory-embedding:80
    networks:
      - app-network
    # Без этого зависший воркер неотличим от исправного: процесс жив, воспоминания пишутся,
    # но перестают находиться смысловым поиском, и снаружи это выглядит как обычный промах.
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs'),p='/tmp/osinara-memory-embedding-worker-ready';if(!fs.existsSync(p)||Date.now()-fs.statSync(p).mtimeMs>90000)process.exit(1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *bounded-json-logs

  memory-extraction-worker:
    cgroup_parent: osinara.slice
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["node", ".runtime/scripts/memory-extraction-worker.js"]
    network_mode: none
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs'),p='/tmp/osinara-memory-extraction-worker-ready';if(!fs.existsSync(p)||Date.now()-fs.statSync(p).mtimeMs<30000)process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 120
    restart: unless-stopped
    logging: *bounded-json-logs

  telegram-ingress-worker:
    cgroup_parent: osinara.slice
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    depends_on:
      agent:
        condition: service_healthy
    entrypoint: ["node", ".runtime/scripts/telegram-ingress-worker.js"]
    environment:
      AGENT_INTERNAL_BASE_URL: http://agent:3000
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:?TELEGRAM_WEBHOOK_SECRET_TOKEN is required}
    networks:
      - app-network
    restart: unless-stopped
    logging: *bounded-json-logs

  edge:
    cgroup_parent: osinara.slice
    image: ${OSINARA_EDGE_IMAGE:?OSINARA_EDGE_IMAGE must be an exact digest reference}
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/eve/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
      - edge-frontend
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
    logging: *bounded-json-logs

  sandbox-runtime-image:
    cgroup_parent: osinara.slice
    image: ${SANDBOX_RUNTIME_IMAGE:?SANDBOX_RUNTIME_IMAGE must be an exact digest reference}
    command: ["true"]
    network_mode: none
    restart: "no"
    logging: *bounded-json-logs

  sandbox-runner:
    cgroup_parent: osinara.slice
    image: ${OSINARA_SANDBOX_RUNNER_IMAGE:?OSINARA_SANDBOX_RUNNER_IMAGE must be an exact digest reference}
    depends_on:
      sandbox-egress-proxy:
        condition: service_healthy
      sandbox-runtime-image:
        condition: service_completed_successfully
    environment:
      SANDBOX_RUNTIME_IMAGE: ${SANDBOX_RUNTIME_IMAGE:?SANDBOX_RUNTIME_IMAGE must be an exact digest reference}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sandbox-control
    read_only: true
    restart: unless-stopped
    logging: *bounded-json-logs
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tool-environments:/runner/tools
      - workspace-data:/runner/workspaces

  sandbox-egress-proxy:
    cgroup_parent: osinara.slice
    image: ${OSINARA_SANDBOX_EGRESS_PROXY_IMAGE:?OSINARA_SANDBOX_EGRESS_PROXY_IMAGE must be an exact digest reference}
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3128,'127.0.0.1').on('connect',function(){this.destroy();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
      - sandbox-egress
    read_only: true
    restart: unless-stopped
    logging: *bounded-json-logs
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  cli-proxy-auth:
    name: osinara-production-cli-proxy-auth
  postgres-data:
    name: osinara-production-postgres-data
  memory-embedding-model-e5:
    name: osinara-production-memory-embedding-model-e5
  google-workspace-credentials:
    name: osinara-production-google-workspace-credentials
  sandbox-data:
    name: osinara-production-sandbox-data
  tool-environments:
    name: osinara-production-tool-environments
  workspace-data:
    name: osinara-production-workspace-data

networks:
  app-network:
    name: osinara-production-app-network
  edge-frontend:
    name: osinara-production-edge-frontend
  sandbox-control:
    internal: true
    name: osinara-production-sandbox-control
  sandbox-egress:
    internal: true
    name: osinara-production-sandbox-egress
