name: osinara-test

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: osinara_test
      POSTGRES_PASSWORD: osinara-test-only
      POSTGRES_USER: osinara_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osinara_test -d osinara_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  tests:
    build:
      context: .
      target: test
    command: ["sh", "-c", "npm run migrate && npm run typecheck && npm test && npm run build"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://osinara_test:osinara-test-only@postgres:5432/osinara_test
      INVITATION_SIGNING_SECRET: integration-test-signing-secret-32-chars
      RUN_DATABASE_INTEGRATION_TESTS: "true"

  memory-embedding:
    profiles: ["workers"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    command:
      - --model-id
      - intfloat/multilingual-e5-small
      - --revision
      - 614241f622f53c4eeff9890bdc4f31cfecc418b3
      - --auto-truncate=false
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 120

  memory-extraction-worker:
    profiles: ["workers"]
    build:
      context: .
      target: runtime
    entrypoint: ["node", ".runtime/scripts/memory-extraction-worker.js"]
    network_mode: none
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs'),p='/tmp/osinara-memory-extraction-worker-ready';if(!fs.existsSync(p)||Date.now()-fs.statSync(p).mtimeMs<30000)process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 120
    restart: "no"
