# Alerts for Osinara that depend only on its logs, which arrive as soon as the application runs.
# Alerts that need the database exporter live in osinara-state.yaml.
groups:
  - name: osinara-heartbeat
    interval: 30s
    rules:
      # One rule per dispatcher: silence is the only signal a stopped scheduler produces.
      # Each is gated on the application still writing logs, so enabling this file, restarting the
      # hub, or a server that is simply gone does not fire every scheduler alert at once. A dead
      # server is already covered by HostDown and ContainerExited.
      #
      # Each is also stood down while a release is running: the deployment stops every container,
      # and dispatchers that are supposed to be down are not an incident. The deadline is published
      # by production-deploy.sh and expires on its own, so a deployment that dies without closing it
      # cannot silence these rules for longer than one release takes. The project is named in the
      # selector because the left side carries no `project` label to match on: without it, a
      # release of any other project on the server would stand these rules down too.
      # Only rules about the present state stand down. The log-burst rules below count lines that
      # were already written, and suppressing those would hide a burst that happened just before
      # the release started.
      #
      # The hold exists because the window and the metric do not resume together. The window closes
      # when the deployment finishes and the containers are already writing logs by then, but this
      # metric comes back only at the end of a chain, and every link of it is bounded by config:
      # up to 60s until the next whole minute, because each dispatcher is `cron: "* * * * *"`;
      # up to 60s of aggregation, because the log rule group runs at `interval: 1m`;
      # up to 30s of evaluation, because this group runs at `interval: 30s`.
      # On top of those two and a half minutes sits the first cycle's own duration, which nothing
      # bounds: the memory review dispatcher drains whatever the downtime accumulated. Five minutes
      # is therefore room to spare rather than a fit — three would have survived the release of
      # 2026-09-20 by half a minute and nothing else.
      # Without a hold, one evaluation inside that gap woke the duty reader with three critical
      # alerts on every single release. The cost is stated plainly: a real dispatcher outage is now
      # reported about ten minutes in rather than five, which is still ahead of the family noticing
      # and no later than OsinaraIngressStuck.
      - alert: OsinaraSchedulerHeartbeatMissing
        expr: >-
          absent_over_time(osinara_schedule_tick_1m{schedule="reminder-dispatch"}[5m])
          and on() present_over_time(log_lines_1m{project="osinara-production"}[5m])
          unless on() deploy_window_end_timestamp_seconds{project="osinara-production"} > time()
        for: 5m
        labels:
          severity: critical
          project: osinara-production
          schedule: reminder-dispatch
        annotations:
          summary: 'Напоминания не обрабатываются 5 минут'
          description: 'Ежеминутный диспетчер напоминаний не отчитался об успешном цикле. Напоминания, уборка сессий и рабочих областей не выполняются.'
          runbook: 'Проверить контейнер agent: живой ли процесс, отвечает ли база. Искать в логах AGENT_SCHEDULE_TICK и ошибки того же периода.'

      - alert: OsinaraSchedulerHeartbeatMissing
        expr: >-
          absent_over_time(osinara_schedule_tick_1m{schedule="agent-schedule-dispatch"}[5m])
          and on() present_over_time(log_lines_1m{project="osinara-production"}[5m])
          unless on() deploy_window_end_timestamp_seconds{project="osinara-production"} > time()
        for: 5m
        labels:
          severity: critical
          project: osinara-production
          schedule: agent-schedule-dispatch
        annotations:
          summary: 'Автономные сценарии по расписанию не запускаются 5 минут'
          description: 'Ежеминутный диспетчер пользовательских сценариев не отчитался об успешном цикле.'
          runbook: 'То же, что и для напоминаний: контейнер agent и доступность базы.'

      - alert: OsinaraSchedulerHeartbeatMissing
        expr: >-
          absent_over_time(osinara_schedule_tick_1m{schedule="agent-schedule-check-dispatch"}[5m])
          and on() present_over_time(log_lines_1m{project="osinara-production"}[5m])
          unless on() deploy_window_end_timestamp_seconds{project="osinara-production"} > time()
        for: 5m
        labels:
          severity: warning
          project: osinara-production
          schedule: agent-schedule-check-dispatch
        annotations:
          summary: 'Мониторы агента не проверяются 5 минут'
          description: 'Ежеминутный цикл проверок мониторов не отчитался об успешном цикле. Агент не узнает о событиях, за которыми следят мониторы.'
          runbook: 'Проверить контейнер agent, доступность базы и sandbox-runner. Искать в логах AGENT_SCHEDULE_CHECK_DISPATCH_FAILED и AGENT_SCHEDULE_CHECK_UNAVAILABLE.'

      - alert: OsinaraSchedulerHeartbeatMissing
        expr: >-
          absent_over_time(osinara_schedule_tick_1m{schedule="memory-review-dispatch"}[5m])
          and on() present_over_time(log_lines_1m{project="osinara-production"}[5m])
          unless on() deploy_window_end_timestamp_seconds{project="osinara-production"} > time()
        for: 5m
        labels:
          severity: critical
          project: osinara-production
          schedule: memory-review-dispatch
        annotations:
          summary: 'Проверка памяти групп и доставка инцидентов остановлены 5 минут'
          description: 'Диспетчер проверки памяти не отчитался об успешном цикле. Владелец перестанет получать и продуктовые уведомления о сбоях.'
          runbook: 'Проверить контейнер agent и таблицу operational_incidents на скопившиеся записи pending.'

  - name: osinara-logs
    interval: 30s
    rules:
      # Everything structured that is not a routine notice. The exclusion is an explicit list of
      # the codes Osinara emits through console.info, not a suffix pattern: a pattern silently
      # reclassifies codes nobody checked, and AGENT_TELEGRAM_SILENT_TURN alone would have raised
      # this alert during ordinary family conversation. A code missing from the list counts as a
      # problem, which is the safe direction and prompts adding it here deliberately.
      #
      # A test reads every console.info code in the sources and fails when one is missing here,
      # since a release restarts the runtime and recovers its turns: the start, stop and recovery
      # lines lit this alert on a healthy deployment (#320). AGENT_SCHEDULE_CYCLE_SKIPPED is
      # information too and stays counted on purpose: a dispatcher still busy when the next minute
      # comes is the first sign of an overloaded host (#336).
      #
      # The two SANDBOX_EGRESS_*_CLOSED codes are connections that ended the way web traffic ends:
      # a browser in the sandbox dropping a request, a site dropping an established tunnel. Over
      # two weeks of production they were 1255 records against 21 real rejections.
      # SANDBOX_EGRESS_HOST_NOT_FOUND is a mistyped address the resolver answered for: a morning
      # scenario repeating one twice lit this alert (#436).
      #
      # SANDBOX_EGRESS_UPSTREAM_FAILED, SANDBOX_EGRESS_HTTP_FAILED and SANDBOX_EGRESS_IPV4_RESOLUTION_FAILED
      # are a site that did not open: no connection, no answer, or no answer from DNS for its name. The
      # owner decided that one site that does not open is not an alert, and a whole day with nothing
      # opened is (#499): OsinaraSitesUnreachable owns that signal. SANDBOX_EGRESS_SITE_METRICS is the
      # minute tally it reads. A refusal by the proxy's own rules stays counted as
      # AGENT_SANDBOX_EGRESS_CONNECT_REJECTED, and the host's Xray failing to open a tunnel as
      # AGENT_SANDBOX_EGRESS_UPSTREAM_PROXY_FAILED: no site was asked, our own path is broken.
      #
      # MODEL_TRANSIENT_RESPONSE is one line per refused attempt of a call that waits out the model
      # hub for up to two minutes (#417): OsinaraModelTransientBurst owns that signal.
      #
      # SANDBOX_API_KEY_USED is one line per request a skill makes with an API key, and the
      # API_KEY_* intake codes are the owner's own steps (a key stored, sent late or twice).
      #
      # The REMINDER_AWAITING_*, REMINDER_TIMEZONE_FOLLOWUP_SENT and NOTIFICATION_TIMEZONE_* codes are
      # the course of a reminder waiting for a timezone (#451); a failed question stays counted as
      # AGENT_REMINDER_TIMEZONE_FOLLOWUP_FAILED.
      #
      # The PRIVATE_QUESTION_* codes here are the course of a /me question (#467): the menus synced at
      # every start, a question taken, refused by its rules, answered or cancelled by its author. A
      # question lost to the window or the throttle and every failed answer stay counted.
      #
      # WIDGET_SENT, WIDGET_UPDATED and WIDGET_QUERY are one line per widget, change and press (#468);
      # WIDGET_HTML_REFUSED is the model's own page refused by the check and returned to it.
      # AGENT_TELEGRAM_WIDGET_SERVER_UPDATE_DROPPED stays counted: the beta server is subscribed to
      # more than presses.
      #
      # ATTACHMENT_UNRECEIVED and VOICE_UNRECEIVED are a file or voice message the agent explained to
      # its sender (16.11.2026): OsinaraIncomingFilesUnreceived owns that signal. The download failure
      # under a photo stays counted as AGENT_ATTACHMENT_DOWNLOAD_FAILED.
      #
      # The BACKGROUND_TASK_* codes here are the course of a background task (#519): queued, started,
      # taken over after a restart, finished (any outcome), asked, stopped, its author's access lost,
      # its report answered, superseded or dropped for want of a listener. A failed report
      # (EVENT_RETRY, EVENT_GAVE_UP, EVENT_FAILED) and a broken dispatcher stay counted.
      - alert: OsinaraErrorBurst
        expr: >-
          sum by (host) (sum_over_time(log_code_lines_1m{project="osinara-production",
          code!~"AGENT_(SCHEDULE_TICK|SCHEDULE_CHECK|TELEGRAM_SILENT_TURN|MEMORY_PURGE_COMPLETED|DATABASE_BOOKKEEPING_RECOVERY|RUNTIME_DEAD_PROCESS_RECONCILED|TELEGRAM_INGRESS_RECOVERED|TELEGRAM_OBSERVER_TRANSFERRED|TELEGRAM_DATABASE_RECOVERY|MEMORY_WRITE_SUCCEEDED|MEMORY_WRITE_DEFERRED|MEMORY_INDEX_RETRY_CLAIMED|MEMORY_INDEX_CHUNK_RESPLIT|MEMORY_USAGE_DIRECTIVE|MEMORY_EMBEDDING_WORKER_STARTED|MEMORY_EMBEDDING_WORKER_WAITING|MODEL_CALL_METRICS|MODEL_TRANSIENT_RESPONSE|MODEL_PROXY_ENABLED|TOOL_CALL_METRICS|SKILL_SYNC_METRICS|MEMORY_SEARCH_METRICS|MEMORY_RETRIEVAL_METRICS|MEMORY_REVIEW_LANE_METRICS|SANDBOX_EGRESS_CLIENT_CLOSED|SANDBOX_EGRESS_UPSTREAM_CLOSED|SANDBOX_EGRESS_HOST_NOT_FOUND|SANDBOX_EGRESS_UPSTREAM_ENABLED|SANDBOX_EGRESS_SITE_METRICS|SANDBOX_EGRESS_UPSTREAM_FAILED|SANDBOX_EGRESS_HTTP_FAILED|SANDBOX_EGRESS_IPV4_RESOLUTION_FAILED|CONVERSATION_WAKEUP_OBSERVER_RELEASED|CONVERSATION_WAKEUP_RECOVERED|CONVERSATION_WAKEUP_RUN_ALREADY_CLOSED|RUNNER_LOCK_RETAKEN|RUNTIME_STARTED|RUNTIME_STOPPING|SCHEDULE_CONVERSATION_ENQUEUED|TURNS_RECOVERED|TURN_DEFERRED_BY_MAINTENANCE|TELEGRAM_DRAIN_WAITING|API_KEY_VALUE_STORED|API_KEY_INTAKE_CLOSED|API_KEY_INTAKE_REDELIVERED|API_KEY_REDELIVERY_DELETE_SKIPPED|API_KEY_LATE_MESSAGE_WITHHELD|SANDBOX_API_KEY_USED|REMINDER_AWAITING_TIMEZONE|REMINDER_AWAITING_ACTIVATED|REMINDER_AWAITING_MISSED|REMINDER_AWAITING_EXPIRED|REMINDER_TIMEZONE_FOLLOWUP_SENT|NOTIFICATION_TIMEZONE_INFERRED|NOTIFICATION_TIMEZONE_CORRECTED|TELEGRAM_QUIET_CALLBACK_ANSWER_FAILED|GROUP_DISCONNECTED|GROUP_RECONNECTED|GROUP_REMOVED|GROUP_BOT_MEMBERSHIP_CHANGED|GROUP_DISCONNECTED_TURN_SILENCED|GROUP_DISCONNECTED_PROMPT_LEFT|TELEGRAM_WEBHOOK_SUBSCRIPTION|PRIVATE_QUESTION_COMMANDS_SYNCED|PRIVATE_QUESTION_PLACEHOLDER_SENT|PRIVATE_QUESTION_REFUSED|PRIVATE_QUESTION_ANSWERED|PRIVATE_QUESTION_CANCELLED|WIDGET_SENT|WIDGET_UPDATED|WIDGET_QUERY|WIDGET_HTML_REFUSED|ATTACHMENT_UNRECEIVED|VOICE_UNRECEIVED|BACKGROUND_TASK_QUEUED|BACKGROUND_TASK_STARTED|BACKGROUND_TASK_RESUMED|BACKGROUND_TASK_FINISHED|BACKGROUND_TASK_QUESTION|BACKGROUND_TASK_STOP_REQUESTED|BACKGROUND_TASK_ACCESS_LOST|BACKGROUND_TASK_EVENT_ANSWERED|BACKGROUND_TASK_EVENT_SUPERSEDED|BACKGROUND_TASK_EVENT_DROPPED)"}[5m])) > 10
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Osinara записала {{ $value }} ошибок с кодом за 5 минут'
          description: 'Всплеск ошибок приложения. Для пользователя это обычно выглядит как неотвеченные сообщения или потерянные действия.'
          runbook: 'Сгруппировать строки по полю code за этот период и разбирать самый частый код.'

      # Every attempt of the bot to open a site failed for a whole day: reading a page, the sandbox
      # browser and commands all go through the sandbox egress proxy, and none of them got through.
      # One site that does not open is not an alert by the owner's decision (#499); this is the alert
      # for the case where nothing opens. A day without any attempt is not an outage and stays silent.
      #
      # The last condition asks for the tally a day back. Recording rules do not fill the past, so
      # after these rules are installed, or after a gap on the hub, the window holds less than a day,
      # and an hour of failures would read as a whole day with nothing opened. The proxy writes its
      # tally every minute even when idle, so the series is there a day back whenever it ran then.
      - alert: OsinaraSitesUnreachable
        expr: >-
          sum(sum_over_time(osinara_sandbox_egress_opened_1m[24h])) == 0
          and sum(sum_over_time(osinara_sandbox_egress_failed_1m[24h])) > 0
          and sum(count_over_time(osinara_sandbox_egress_opened_1m[1h] offset 23h)) > 0
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'За сутки бот не открыл ни одного сайта'
          description: 'Все попытки бота открыть сайт за последние сутки — чтением страницы, браузером или командой в песочнице — закончились отказом. Для семьи это выглядит так, будто у бота нет интернета.'
          runbook: 'Строки прокси песочницы за сутки: AGENT_SANDBOX_EGRESS_UPSTREAM_FAILED, AGENT_SANDBOX_EGRESS_HTTP_FAILED и AGENT_SANDBOX_EGRESS_IPV4_RESOLUTION_FAILED — какие сайты и с какой ошибкой. Все с via=upstream — проверить вход Xray osinara-sandbox; отказы DNS — доступ сервера к 1.1.1.1; таймауты соединения ко всем сайтам — выход сервера в интернет и контейнер sandbox-egress-proxy.'

      - alert: OsinaraMemoryUnavailable
        expr: sum(sum_over_time(log_code_lines_1m{project="osinara-production", code="AGENT_MEMORY_UNAVAILABLE"}[5m])) > 0
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Osinara отвечала без доступа к памяти'
          description: 'При подготовке ответа не удалось прочитать долговременную память: ассистент отвечает, но не помнит контекст семьи.'
          runbook: 'Проверить базу и сервис эмбеддингов memory-embedding; в строке есть поле failurePhase с фазой сбоя.'

      # The turn kept its memory, but only half of it: the query vector could not be computed, so
      # the word branches answered alone and a rephrased question simply does not match. The model
      # is told, and the person is told by the model — but nobody watching the service would see
      # it, because the whole point of the change was that the turn no longer fails.
      #
      # Not covered by OsinaraEmbeddingFailed: that one watches AGENT_MEMORY_EMBEDDING_* codes, and
      # the client writes one only when the service is unreachable. A 429, a 5xx or a model
      # mismatch throws without a line of its own, and this is then the only trace there is.
      - alert: OsinaraMemorySemanticBranchDown
        expr: >-
          sum(sum_over_time(log_code_lines_1m{project="osinara-production",
          code="AGENT_MEMORY_SEMANTIC_BRANCH_UNAVAILABLE"}[5m])) > 0
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Смысловой поиск памяти отключён: подборка собрана только по словам'
          description: 'Ассистент помнит и отвечает, но перефразированный вопрос перестал находить сохранённое. Снаружи это выглядит как забывчивость.'
          runbook: 'Проверить контейнер memory-embedding, затем поле causeCode в строке: недоступность сети, отказ провайдера или несовпадение модели.'

      # Memory answered, but with nothing in hand. A single empty turn is normal: the model is told
      # outright that an irrelevant question may return an empty selection, and a family chat
      # contains plenty of questions that are not about memory. What is not normal is most of a
      # day's turns coming back empty — measured production behaviour is 0 empty out of 29, every
      # one of them filling all twelve slots.
      #
      # Hence the deliberately dull shape: a whole day, at least ten searches in it, and more than
      # half of them empty. A broken embedder or a retrieval change that cuts everything makes every
      # turn empty, so it clears 60% the moment ten turns have happened. The accepted cost is that a
      # very quiet day never reaches ten searches and the rule stays silent until traffic returns;
      # an outright failure is already covered by OsinaraEmbeddingFailed, OsinaraMemoryUnavailable and
      # OsinaraMemorySemanticBranchDown,
      # and this rule exists for the quiet degradation those two cannot see.
      - alert: OsinaraMemoryRetrievalEmpty
        expr: >-
          sum(sum_over_time(osinara_memory_retrieval_empty_1m[24h]))
          / sum(sum_over_time(osinara_memory_retrieval_succeeded_1m[24h])) > 0.6
          and sum(sum_over_time(osinara_memory_retrieval_succeeded_1m[24h])) >= 10
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Поиск памяти возвращает пустую подборку в {{ $value | humanizePercentage }} ходов за сутки'
          description: 'Ассистент почти всегда отвечает, не получив ни одной записи памяти. Для семьи это выглядит как забывчивость: он не помнит того, о чём ему рассказывали.'
          runbook: 'В строках AGENT_MEMORY_RETRIEVAL_METRICS смотреть semanticTopSimilarity, simpleTopRank и russianTopRank: все около нуля — сломан сервис эмбеддингов или FTS; счета высокие, а *Matched больше нуля при нулевых *Qualified — отсекают пороги поиска.'

      # Memory kept offering records for three days and the model named none of them as used.
      # Measured per turn over 23.09–06.10 — the line shipped on 20.09, and in its first three days
      # the model wrote it in 4–48% of turns, so those days describe the rollout, not the product:
      # about 300 records offered on a median day, 0 to 63 used per day, and never fewer than 7
      # used over any three days in a row. Nothing at all over three days with at least a median
      # day's offer is therefore not a quiet day: either the usage line stopped arriving or reaching
      # the counter, or the selection fills its slots with records no answer can use.
      #
      # Deliberately the collapse and not a low share. A day is too small for a share: the used
      # count runs from 0 to 63, and a threshold on it would fire on ordinary quiet days. Where the
      # share should sit is the job of the retrieval measurements, not of a duty alert.
      #
      # `or vector(0)`: a minute without any usage line writes no sample, and three silent days
      # must read as zero rather than as no data, which would keep the rule silent exactly when the
      # line is gone.
      #
      # The last condition asks for offers in the oldest day of the window. Recording rules do not
      # fill the past, so for two days after these rules are installed — or after a gap on the hub
      # — the window holds one day, and one quiet day with a median offer would clear both other
      # conditions: the seven-in-three-days record above is about full windows only.
      - alert: OsinaraMemoryNeverUsed
        expr: >-
          (sum(sum_over_time(osinara_memory_used_1m[72h])) or vector(0)) == 0
          and sum(sum_over_time(osinara_memory_offered_tracked_1m[72h])) >= 300
          and sum(count_over_time(osinara_memory_offered_tracked_1m[24h] offset 48h)) > 0
        for: 60m
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Трое суток модель не опирается ни на одну запись памяти'
          description: 'Память подбирает записи к каждому ответу, но ассистент ни разу не назвал их полезными. Для семьи это выглядит так, будто он не помнит того, о чём ему рассказывали, хотя записи на месте.'
          runbook: 'В строках AGENT_MEMORY_USAGE_DIRECTIVE смотреть declared и failed: declared всегда false — модель перестала писать служебную строку; failed не пусто — не работает счётчик; namedCount больше нуля при rejectedCount, равном namedCount, — модель называет записи, которых эта сессия ей не показывала; countedCount больше нуля при countedSelectionCount, равном нулю, — ответы опираются только на то, что модель нашла сама, а автоподборка предлагает не то. Если строка на месте и всё отклонено правильно, смотреть memoryEvidence в AGENT_MEMORY_RETRIEVAL_METRICS: что и какими ветками подбирается.'

      # The family is matched by prefix because fifteen of its sixteen codes are failures. The
      # sixteenth says the indexer started, which it does on every release — and for a whole day
      # that healthy start was the only thing this alert ever counted. Codes that mean normal
      # operation are declared in agent/lib/memory-config.ts, and a test holds this exclusion and
      # the one in OsinaraErrorBurst to that list: add a code there without excluding it in both and
      # the build fails, not the duty reader.
      #
      # Only the indexer's lines count. The agent writes the same AGENT_MEMORY_EMBEDDING_PROVIDER_*
      # codes when a search cannot reach the service; 08.10 such a read fired this alert and sent the
      # duty reader to an indexer with no failed job (#352). Reads belong to
      # OsinaraMemorySemanticBranchDown. The service label comes from the hub's shared
      # log_code_lines_1m record (stats by host, project, service, code).
      - alert: OsinaraEmbeddingFailed
        expr: >-
          sum(sum_over_time(log_code_lines_1m{project="osinara-production",
          service="memory-embedding-worker",
          code=~"AGENT_MEMORY_EMBEDDING_.+",
          code!="AGENT_MEMORY_EMBEDDING_WORKER_STARTED",
          code!="AGENT_MEMORY_EMBEDDING_WORKER_WAITING"}[5m])) > 0
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Индексация новых воспоминаний завершилась ошибкой'
          description: 'Воспоминание сохранено, но не проиндексировано: поиск по нему работать не будет, пока задача не выполнится.'
          runbook: 'Проверить контейнеры memory-embedding и memory-embedding-worker, затем osinara_memory_embedding_jobs со статусом failed и osinara_memory_embedding_pending. Обе величины существуют всегда: пустой ответ означает, что метрика не собирается, а не что отказов нет.'

      # The model cannot be reached: calls end in failure because the connection drops or never opens
      # (#492). OsinaraModelTransientBurst counts only answers of the hub and stayed silent on
      # 14.11.2026 through 151 failed calls in two outages, caught only because a scenario fell in
      # them. Over the two weeks before, failed calls happened on one other day, once. More than five
      # in ten minutes is about one message the bot could not answer, after its retries and the wait
      # for the hub; the alert goes out ten minutes after calls succeed again.
      - alert: OsinaraModelCallsFailing
        expr: sum(sum_over_time(osinara_model_call_failed_1m[10m])) > 5
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Вызовы модели не проходят: {{ $value }} неудачных за 10 минут'
          description: 'Бот не может получить ответ модели: соединение с ней обрывается, не открывается или она отвечает ошибкой. Люди в это время не получают ответов, сценарии по расписанию не приходят.'
          runbook: 'Причина — в поле cause строк AGENT_TURN_FAILED за это время: ECONNRESET или Connect Timeout — путь к модели через Xray (journalctl -u xray, вход osinara-model, узел vless-am); ответы 429 или 5xx — сам хаб модели, см. AGENT_MODEL_TRANSIENT_RESPONSE.'

      - alert: OsinaraModelTransientBurst
        expr: sum(sum_over_time(osinara_model_transient_1m[10m])) > 5
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Поставщик модели ответил ошибкой {{ $value }} раз за 10 минут'
          description: 'Провайдер отвечает кодами 429 или 5xx. Ответы приходят медленнее, часть ходов может обрываться.'
          runbook: 'Проверить статус провайдера и поле statusCode в строках AGENT_MODEL_TRANSIENT_RESPONSE.'

      # A photo, file or voice message a person sent did not reach the agent. Since 16.11.2026 such a
      # message is not failed: the agent tells the person in its own words and nothing goes to the
      # owner, so OsinaraIngressFailing no longer sees these; this alert is how the duty reader learns
      # of a run of them. Only reasons outside the file count (see the log rules). One file Telegram
      # did not hand over is background, like one site that did not open (#499). Three within an hour,
      # not the two OsinaraIngressFailing keeps for messages: the lines are per file, and an album of
      # two photos Telegram did not hand over is one message.
      - alert: OsinaraIncomingFilesUnreceived
        expr: sum(sum_over_time({__name__=~"osinara_(attachment|voice)_unreceived_1m"}[1h])) >= 3
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'За час бот не смог принять присланных файлов и голосовых: {{ $value }}'
          description: 'Люди присылали фото, файлы или голосовые, а бот не смог их получить из-за сбоя Telegram или распознавания речи. Каждому агент сам объяснил, что случилось, и попросил прислать ещё раз или написать текстом.'
          runbook: 'Строки AGENT_ATTACHMENT_UNRECEIVED и AGENT_VOICE_UNRECEIVED за час: поля reason, cause, detail и chatId или updateId. telegram_failure — Telegram не отдаёт файлы, исходная ошибка в detail. recognition_unavailable — ошибка распознавания в cause и detail: ключ, оплата или доступность Groq. interrupted — распознавание прервалось на перезапуске или при потере аренды.'

      - alert: OsinaraDatabaseConnectionLost
        expr: sum(sum_over_time(log_code_lines_1m{project="osinara-production", code=~"AGENT_(DATABASE_CONNECTION_LOST|WORKFLOW_NOTIFY_CONNECTION_LOST)"}[5m])) > 0
        labels:
          severity: critical
          project: osinara-production
        annotations:
          summary: 'Разорвано соединение с базой данных'
          description: 'Приложение потеряло соединение с PostgreSQL. Сообщения пользователей не обрабатываются или обрабатываются частично.'
          runbook: 'Проверить контейнер postgres, его проверку здоровья и журнал на предмет аварийного перезапуска.'

      # Осинара сама отклонила цель ответа: сообщение, на которое ответил человек, не принадлежит
      # текущему чату, либо разобранный и сырой апдейт назвали разные сообщения. Ни того, ни другого
      # Telegram в норме не присылает, поэтому одной строки достаточно для тревоги: это либо смена
      # формата Bot API, либо подделанный апдейт.
      - alert: OsinaraReplyTargetRejected
        expr: sum(sum_over_time(log_code_lines_1m{project="osinara-production", code="AGENT_TELEGRAM_REPLY_TARGET_REJECTED"}[15m])) > 0
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Отклонена цель ответа в Telegram'
          description: 'Приложение отказалось принять сообщение, на которое отвечал человек: оно из другого чата либо идентификаторы в апдейте разошлись. Для пользователя ответ теряет контекст цитаты. В штатной работе этого не бывает.'
          runbook: 'В строке есть reason: foreign_chat — цель из другого чата, identity_mismatch — расхождение внутри апдейта. Разовый случай разбирать по telegramChatId и telegramReplyTargetMessageId; массовые identity_mismatch означают смену формата Bot API или разбора апдейта в агенте.'

      - alert: OsinaraIncidentDeliveryUnconfirmed
        expr: sum(sum_over_time(log_code_lines_1m{project="osinara-production", code="AGENT_INCIDENT_DELIVERY_UNCONFIRMED"}[15m])) > 0
        labels:
          severity: warning
          project: osinara-production
        annotations:
          summary: 'Не подтверждена доставка продуктового уведомления владельцу'
          description: 'Osinara не смогла достоверно доставить владельцу сообщение о сбое. Владелец мог не узнать о проблеме.'
          runbook: 'Проверить доступность Telegram с сервера и статусы в таблице operational_incidents.'

