# Recording rules over Osinara's own structured logs.
#
# Enable only after the Osinara release that emits AGENT_SCHEDULE_TICK: until then the
# heartbeat series never appears and its absence alert would fire continuously.
groups:
  - name: logs-osinara
    type: vlogs
    interval: 1m
    rules:
      # Proof that the minute dispatchers completed a cycle: process, database and scheduler
      # are all alive. Silence here is the signal, so the alert lives in MetricsQL.
      - record: osinara_schedule_tick_1m
        expr: 'project:"osinara-production" code:"AGENT_SCHEDULE_TICK" | stats by (schedule) count() as value'

      # Memory pipeline outcomes, one series per outcome, used for both failure alerts and trends.
      - record: osinara_memory_write_1m
        expr: 'project:"osinara-production" code:~"AGENT_MEMORY_WRITE_(SUCCEEDED|FAILED)" | stats by (code, scope) count() as value'

      - record: osinara_memory_retrieval_failed_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_RETRIEVAL_METRICS" outcome:"failed" | stats by (failurePhase) count() as value'

      # Two halves of the same ratio: how many turns searched memory successfully, and how many of
      # them came back with nothing. `memories` counts what the search found; what survived the
      # turn block ceiling is `offeredMemories`, and the difference is `droppedMemories`. A search
      # that runs finds something almost every time, so a high empty share means either the
      # embedding service broke or a retrieval change started cutting too much. The ratio itself lives in the alert.
      # Both are grouped by `outcome`, like every other rule here: it is the one label the filter
      # already fixes, and grouping keeps the emitted series shaped like its neighbours instead of
      # relying on how an ungrouped `stats` row is turned into a series.
      - record: osinara_memory_retrieval_succeeded_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_RETRIEVAL_METRICS" outcome:"succeeded" | stats by (outcome) count() as value'

      - record: osinara_memory_retrieval_empty_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_RETRIEVAL_METRICS" outcome:"succeeded" memories:"0" abstained:"false" | stats by (outcome) count() as value'

      # Turns the selection left empty on purpose: the message was small talk — greetings, thanks,
      # laughter — and no search ran (#341). Kept out of the empty share above, which is about a
      # search that broke; this one is the trend of how much chatter there is.
      - record: osinara_memory_retrieval_abstained_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_RETRIEVAL_METRICS" outcome:"succeeded" abstained:"true" | stats by (outcome) count() as value'

      # How much of what memory offers the answers actually rest on, as the model declares it in
      # its usage line. The ratio of the first two is the daily share of offered records used.
      #
      # Only turns with a show journal enter the denominator (`usageTracked`): the counter accepts
      # a named record only if this session's journal shows it, and scheduled runs or delegated
      # children keep none, so their records could never be counted as used.
      #
      # `countedCount`, not `usedCount`: the usage line is written on every message of a turn, the
      # progress note before a tool call included, and a record named in two of them was still used
      # once. The counter moves once per show, so its own count needs no further de-duplication.
      # And of it only `countedSelectionCount`: since #339 the counter also takes records the model
      # found by its own search or list, or read in the standing profile, none of which the
      # selection offered. A selection shown a turn earlier and used now still counts.
      #
      # The two sides do not match exactly, and the gap is accepted rather than corrected here: the
      # journal also holds records the profile view showed after the budget dropped them from the
      # block, so they can be used without being in `offeredMemories`. The offline report
      # (`npm run memory:usage-report`) tells it apart. An answer finished after an approval is no
      # longer a gap: since #339 it is counted against every show its session keeps.
      - record: osinara_memory_offered_tracked_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_RETRIEVAL_METRICS" outcome:"succeeded" usageTracked:"true" | stats by (outcome) sum(offeredMemories) as value'

      - record: osinara_memory_used_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_USAGE_DIRECTIVE" | stats by (code) sum(countedSelectionCount) as value'

      # Whether the final answer carried the usage line at all. A turn without it says nothing
      # about memory, and the rule being dropped looks exactly like memory that never helps. Only
      # the final answer counts here (`finishReason` stop): a progress step may skip the line.
      - record: osinara_memory_usage_final_answers_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_USAGE_DIRECTIVE" finishReason:"stop" | stats by (declared) count() as value'

      # What the offered records cost in the block, so the used share can be read as characters
      # spent per record the answer rested on. JS string length, not tokens.
      - record: osinara_memory_offered_characters_1m
        expr: 'project:"osinara-production" code:"AGENT_MEMORY_RETRIEVAL_METRICS" outcome:"succeeded" usageTracked:"true" | stats by (outcome) sum(memorySerializedCharacters) as value'

      # Model transport degradation: 429 and 5xx answers that the agent retried or surfaced.
      - record: osinara_model_transient_1m
        expr: 'project:"osinara-production" code:"AGENT_MODEL_TRANSIENT_RESPONSE" | stats by (statusCode) count() as value'
