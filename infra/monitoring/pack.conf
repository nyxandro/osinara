# Пакет наблюдения Osinara. Читается install/add-project.sh из репозитория observability.

# Имя проекта. Совпадает с меткой project в тревогах и с аргументом hub-status.
# Это имя compose-проекта боевой установки: рядом на той же машине живёт `osinara` для
# разработки, у него свои контейнеры и никаких правил, и путать их нельзя — установщик
# печатает это имя как команду проверки, а проверка не того проекта всегда молчит.
PROJECT=osinara-production

# Файлы с секретами, которые пакет не несёт и которые кладутся на сервер руками.
# Без них экспортёр не поднимется — это лучше, чем стартовать с придуманным паролем
# и молча не отдавать ни одной метрики.
REQUIRES_ENV_FILES="osinara-metrics.env"
