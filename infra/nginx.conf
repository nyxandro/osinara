events {}

http {
  # Docker's embedded DNS tracks service containers recreated under the same Compose name.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # A successful liveness check carries no information and there are two of them every five
  # seconds, so they made up 151 167 of 355 135 log lines over a week and pushed the readable
  # history down to under six days. A failed check is exactly what an investigation looks for and
  # keeps being written.
  map $status $osinara_health_loggable {
    ~^[23] 0;
    default 1;
  }

  upstream osinara_agent {
    # Shared state and `resolve` let workers replace a stale container address without a reload.
    zone osinara_agent 64k;
    server agent:3000 resolve;
  }

  server {
    listen 80;
    client_max_body_size 50m;
    server_tokens off;

    # Telegram is the only public user channel in the current deployment.
    location = /v1/telegram {
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://osinara_agent;
    }

    # Google uses one fixed GET callback; all session binding comes from one-time state in PostgreSQL.
    location = /v1/google-oauth/callback {
      limit_except GET { deny all; }
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://osinara_agent;
    }

    # Health remains public for Docker, Funnel, and future uptime checks.
    location = /v1/health {
      access_log /var/log/nginx/access.log combined if=$osinara_health_loggable;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://osinara_agent;
    }

    # Until the next release: the previous addresses, while Telegram's webhook, the Google sign-in
    # return, the deploy controller and the TLS proxy still use them; the agent serves each as `/v1/…`.
    location = /eve/v1/telegram {
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://osinara_agent;
    }

    location = /eve/v1/google-oauth/callback {
      limit_except GET { deny all; }
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://osinara_agent;
    }

    location = /eve/v1/health {
      access_log /var/log/nginx/access.log combined if=$osinara_health_loggable;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://osinara_agent;
    }

    # Nothing else of the agent is public: the internal drain and any other route stay closed.
    location / {
      return 404;
    }
  }
}
